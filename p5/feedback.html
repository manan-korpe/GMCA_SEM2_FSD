<!DOCTYPE html>
<html>
<head>
  <title>Feedback Form</title>
</head>
<body>

  <h2>Give Feedback</h2>

  <form action="/submit" method="POST">

    <textarea name="message" placeholder="Your Feedback" required></textarea><br><br>
    <button type="submit">Submit</button>
  </form>

</body>
</html>
