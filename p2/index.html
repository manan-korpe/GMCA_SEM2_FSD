<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Key-Value Chatbot</title>

  <style>
    body {
      font-family: Arial;
      background: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .chat-box {
      width: 360px;
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
    }

    .header {
      background: #00adb5;
      color: white;
      padding: 15px;
      text-align: center;
    }

    .messages {
      height: 300px;
      overflow-y: auto;
      padding: 10px;
      background: #fafafa;
    }

    .msg {
      margin: 5px 0;
      padding: 8px 10px;
      border-radius: 8px;
      max-width: 75%;
    }

    .user {
      background: #d1f7c4;
      margin-left: auto;
      text-align: right;
    }

    .bot {
      background: #e0e0e0;
      margin-right: auto;
    }

    .input-box {
      display: flex;
      border-top: 1px solid #ccc;
    }

    .input-box input {
      flex: 1;
      padding: 10px;
      border: none;
      outline: none;
    }

    .input-box button {
      background: #00adb5;
      color: white;
      border: none;
      padding: 10px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="chat-box">

  <div class="header">Chatbot</div>

  <div class="messages" id="chatBox"></div>

  <div class="input-box">
    <input type="text" id="msgInput" placeholder="Ask something...">
    <button onclick="sendMessage()">Send</button>
  </div>

</div>

<script>
  const responses = {
    "hi": "Hello! How can I help you?",
    "hello": "Hi there! What can I do for you?",
    "how are you": "I'm just a bot, but I'm doing great!",
    "what is your name": "I'm a simple JavaScript chatbot.",
    "bye": "Goodbye! Have a nice day!",
    "help": "You can ask me about greetings, name, or say bye."
  };

  function sendMessage() {
    const input = document.getElementById("msgInput");
    const chatBox = document.getElementById("chatBox");

    let message = input.value.trim().toLowerCase();
    if (message === "") return;

    addMessage(message, "user");
    let reply = responses[message];

    if (!reply) {
      reply = "Sorry, I don't understand that.";
    }

    setTimeout(() => {
      addMessage(reply, "bot");
    }, 500);

    input.value = "";
  }

  function addMessage(text, type) {
    const chatBox = document.getElementById("chatBox");

    const div = document.createElement("div");
    div.classList.add("msg", type);
    div.innerText = text;

    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  document.getElementById("msgInput").addEventListener("keypress", function(e) {
    if (e.key === "Enter") sendMessage();
  });
</script>

</body>
</html>
